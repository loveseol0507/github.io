<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>출입처 최신 기사 추천</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 800px; margin: 0 auto; padding: 20px; text-align: center;">
        <h1 style="margin-bottom: 24px;">출입처 최신 기사 추천</h1>
        
        <!-- 카테고리 버튼 영역 -->
        <div id="category-container" style="margin-bottom: 20px;">
            <button class="category-btn active">전체</button>
            <button class="category-btn">자동차</button>
            <button class="category-btn">물류</button>
            <button class="category-btn">로봇</button>
            <button class="category-btn">철강</button>
            <button class="category-btn">비철금속</button>
            <button class="category-btn">전력기기</button>
            <button class="category-btn">에너지</button>
            <button class="category-btn">화학소재</button>
        </div>

        <!-- 뉴스 카드 출력 영역 -->
        <div id="news-container">
            <p style="padding: 20px; color: #666;">기사를 불러오는 중입니다...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
